name: Refresh Instagram gallery

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-sync.yml'
      - 'scripts/sync-instagram.mjs'
      - 'instagram-data.mjs'

permissions:
  contents: read

concurrency:
  group: instagram-sync
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'Anmoldotkapoor/REDROSESTUDIO'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read Royal Rose’s public Instagram link
        run: node scripts/sync-instagram.mjs
      - name: Publish changed previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- index.html data/instagram-feed.json assets/instagram
          if git diff --cached --quiet; then
            echo 'No Instagram post changes.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh Royal Rose Instagram previews'
          git pull --rebase origin main
          git push origin HEAD:main
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" > /dev/null
          echo 'Instagram previews updated and a GitHub Pages build requested.' >> "$GITHUB_STEP_SUMMARY"
